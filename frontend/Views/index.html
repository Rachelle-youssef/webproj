<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LifeLink | Give blood. Share medicine. Save lives.</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta
      name="description"
      content="LifeLink connects blood donors and medicine donors with the people who need them, with every donation checked by an admin."
    />
    <link rel="stylesheet" href="/styles/lifelink.css" />
    <link rel="stylesheet" href="/styles/workspace.css" />
    <link rel="stylesheet" href="/assets/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/styles/map.css" />
    <link rel="stylesheet" href="/styles/theme.css" />
    <link rel="stylesheet" href="/styles/home.css" />
    <link rel="stylesheet" href="/styles/community.css" />
    <link rel="stylesheet" href="/styles/profile.css" />
    <link rel="stylesheet" href="/styles/password.css" />
    <link rel="stylesheet" href="/styles/scanner.css" />
    <link rel="stylesheet" href="/styles/network.css" />
    <link rel="stylesheet" href="/styles/polish.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <header class="top">
      <a class="brand" href="#/home" aria-label="LifeLink home"
        ><span class="drop"></span>LifeLink</a
      >
      <nav id="public-nav" aria-label="Community"></nav>
      <div class="tools">
        <button
          class="icon"
          id="theme"
          aria-label="Toggle dark mode"
          title="Dark / light"
        >
          &#9680;
        </button>
        <div id="who"></div>
      </div>
    </header>
    <div class="app-shell">
      <aside id="workspace-nav" class="workspace-nav" hidden>
        <div class="workspace-label">Your workspace</div>
        <p id="workspace-role"></p>
        <nav id="nav" aria-label="Workspace"></nav>
        <div class="workspace-note">
          <span class="connection-mark" aria-hidden="true"></span>Every connection counts.
        </div>
      </aside>
      <main id="view" tabindex="-1"></main>
    </div>
    <footer>
      <b>LifeLink</b> · Give blood. Share medicine. Save lives.<br />© 2026 LifeLink. All
      donations are admin-verified.
    </footer>

    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/scripts/app.js"></script>
  </body>
</html>
