openapi: 3.1.0
info:
  title: LifeLink API
  version: 3.0.0
  description: |
    REST API of LifeLink, a blood and medicine donation platform for Lebanon.

    **Conventions used by every endpoint**
    - Successful replies: `{ "data": ... }`; lists add `"meta": { "page", "limit", "total", "pages" }`.
    - Errors: `{ "error": { "code", "message", "details"? } }` with the HTTP status codes listed under each endpoint.
    - Lists accept `page` (from 1), `limit` (1 to 100, default 20) and `sort` (a field name, `-` in front for descending).
    - Requests that change data (POST, PATCH, DELETE) must send the header `X-Requested-With: LifeLink`.
    - Signed-in requests carry the `ll_session` cookie, set by `POST /auth/login`.
    - Authentication uses express-session with a MySQL store. The cookie contains only a signed random session ID, not a JWT or user details.
    - Login regenerates the ID; logout deletes its server record. Password changes revoke other sessions and issue a new ID for the current browser.
    - Dates are ISO 8601: `2027-06-01` for dates, `2026-10-21T09:30:00.000Z` (UTC) for moments.
servers:
  - url: /api/v1
tags:
  - name: health
    description: Is the API up and can it reach the database?
  - name: auth
    description: Sign up, sign in, sign out, and who is signed in.
  - name: users
    description: Your own profile and password; account management for admins.
  - name: reference
    description: Fixed lists the forms need (no sign-in).
  - name: blood-requests
    description: Requests for blood, their review, donor matching, invitations and units from the blood bank.
  - name: blood-donations
    description: Offers, invitations, answers, admin acceptance and physical donation completion. A donor may give blood once every 8 weeks (56 days).
  - name: blood-stock
    description: The blood bank's units per blood type and the history of every change.

  - name: calls
  - name: notifications
  - name: feed
  - name: admin
  - name: Medicines
    description: Medicine donations, review, stock, QR labels, requests and handoffs.

paths:
  /health:
    get:
      tags: [ health ]
      summary: Check that the API and its database are working
      operationId: getHealth
      responses:
        '200':
          description: The API and the database are up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Health' }
              example:
                data: { status: ok, database: up, version: 3.0.0, uptime_seconds: 42, time: '2026-10-21T09:30:00.000Z' }
        '503':
          description: The API is running but cannot reach the database.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/register:
    post:
      tags: [ auth ]
      summary: Create an account (donor, recipient or hospital) and sign in
      description: Admin accounts cannot be created here. Hospitals must supply their hospital pin inside Lebanon; donors and recipients need no coordinates. Limited to 10 attempts per 15 minutes per address.
      operationId: register
      parameters: [ { $ref: '#/components/parameters/csrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
            example: { full_name: Maya Nasr, email: maya@example.com, password: Password123, role: donor, city: Beirut, phone: '+961 3 123 456', latitude: 33.89, longitude: 35.5, blood_type_id: 8 }
      responses:
        '201':
          description: Account created; the session cookie is set.
          headers:
            Set-Cookie: { description: 'll_session=...; Path=/api; HttpOnly; SameSite=Strict', schema: { type: string } }
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [ auth ]
      summary: Sign in
      description: A wrong password and an unknown email get the same 401 answer. Limited to 10 attempts per 15 minutes per address.
      operationId: login
      parameters: [ { $ref: '#/components/parameters/csrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
            example: { email: maya@lifelink.test, password: Demo12345 }
      responses:
        '200':
          description: Signed in; the session cookie is set.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Right password, but the account was deactivated (code ACCOUNT_DISABLED).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [ auth ]
      summary: Sign out (clears the session cookie)
      operationId: logout
      parameters: [ { $ref: '#/components/parameters/csrfHeader' } ]
      responses:
        '204': { description: Signed out. }

  /auth/me:
    get:
      tags: [ auth ]
      summary: The signed-in user
      operationId: me
      security: [ { sessionCookie: [] } ]
      responses:
        '200':
          description: The signed-in user's profile.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /users/me:
    patch:
      tags: [ users ]
      summary: Update your own profile
      description: Only the fields listed are accepted; role, email and status cannot be changed here.
      operationId: updateMe
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/csrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
            example: { city: Tripoli, latitude: 34.44, longitude: 35.84, is_available: false }
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /users/me/password:
    patch:
      tags: [ users ]
      summary: Change your password
      description: Every other device is signed out; this one receives a fresh session cookie.
      operationId: changeMyPassword
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/csrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /users:
    get:
      tags: [ users ]
      summary: List accounts (admins only)
      operationId: listUsers
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
        - { name: sort, in: query, schema: { type: string, enum: [ created_at, -created_at, full_name, -full_name, email, -email ], default: -created_at } }
        - { name: role, in: query, schema: { type: string, enum: [ donor, recipient, hospital, admin ] } }
        - { name: is_active, in: query, schema: { type: string, enum: [ 'true', 'false' ] } }
        - { name: q, in: query, description: Searches name and email., schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: One page of accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}:
    get:
      tags: [ users ]
      summary: One account (admins only)
      operationId: getUser
      security: [ { sessionCookie: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } } ]
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/status:
    patch:
      tags: [ users ]
      summary: Activate or deactivate an account (admins only)
      description: A deactivated user is signed out at once and cannot sign in. Admins cannot deactivate themselves.
      operationId: setUserStatus
      security: [ { sessionCookie: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/csrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ is_active ], properties: { is_active: { type: boolean } }, additionalProperties: false }
      responses:
        '200':
          description: The account with its new status.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /blood-types:
    get:
      tags: [ reference ]
      summary: The 8 blood types (ids used by every blood form)
      operationId: listBloodTypes
      responses:
        '200':
          description: All blood types.
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/BloodType' } } } } } }

  /blood-requests:
    post:
      tags: [ blood-requests ]
      summary: Ask for blood (recipients and hospitals)
      description: The request starts as pending until an admin approves it. Hospital accounts can reuse their saved hospital city and pin. Recipients supply the treating hospital city and pin explicitly; their home coordinates are never copied. At most 5 active requests per requester.
      operationId: createBloodRequest
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/csrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BloodRequestInput' }
            example: { blood_type_id: 8, units_needed: 2, urgency: sos, hospital_name: AUBMC }
      responses:
        '201': { description: Request created (pending)., content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BloodRequest' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [ blood-requests ]
      summary: List requests
      description: Admins see all requests; recipients and hospitals see their own; donors see open requests their blood type can be given to (as OpenBloodRequest, without the requester's identity).
      operationId: listBloodRequests
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
        - { name: sort, in: query, schema: { type: string, enum: [ urgency, -urgency, created_at, -created_at, units_needed, -units_needed ], default: -urgency } }
        - { name: status, in: query, schema: { type: string, enum: [ pending, open, fulfilled, cancelled ] } }
        - { name: urgency, in: query, schema: { type: string, enum: [ normal, urgent, sos ] } }
        - { name: blood_type_id, in: query, schema: { type: integer, minimum: 1, maximum: 8 } }
        - { name: city, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { oneOf: [ { $ref: '#/components/schemas/BloodRequest' }, { $ref: '#/components/schemas/OpenBloodRequest' } ] } }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /blood-requests/{id}:
    get:
      tags: [ blood-requests ]
      summary: One request
      description: Anyone who may not see the request gets 404, so its existence is not revealed.
      operationId: getBloodRequest
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/idPath' } ]
      responses:
        '200': { description: The request., content: { application/json: { schema: { type: object, properties: { data: { oneOf: [ { $ref: '#/components/schemas/BloodRequest' }, { $ref: '#/components/schemas/OpenBloodRequest' } ] } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /blood-requests/{id}/review:
    patch:
      tags: [ blood-requests ]
      summary: Approve or deny a pending request (admins)
      description: Approving opens the request to donors; an approved SOS alerts every compatible donor who can give blood today. Denying needs a note, which the requester sees.
      operationId: reviewBloodRequest
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/idPath' }, { $ref: '#/components/parameters/csrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ decision ]
              properties:
                decision: { type: string, enum: [ approve, deny ] }
                note: { type: string, maxLength: 255, description: Required when denying. }
      responses:
        '200': { description: The reviewed request., content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BloodRequest' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /blood-requests/{id}/cancel:
    patch:
      tags: [ blood-requests ]
      summary: Cancel a pending or open request (its requester or an admin)
      description: Donations still waiting on the request are cancelled and their donors told.
      operationId: cancelBloodRequest
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/idPath' }, { $ref: '#/components/parameters/csrfHeader' } ]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 255 } } } } }
      responses:
        '200': { description: The cancelled request., content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BloodRequest' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /blood-requests/{id}/location:
    patch:
      tags: [ blood-requests ]
      summary: Set the treating hospital location on an active request
      description: Recipients and hospitals may update their own pending or open requests; admins may update any pending or open request. The pin must be the treating hospital inside Lebanon. Open requests with a confirmed hospital pin can appear on the public map, without requester identity.
      operationId: updateBloodRequestLocation
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/idPath' }, { $ref: '#/components/parameters/csrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ latitude, longitude ]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200': { description: Request with the selected hospital location., content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BloodRequest' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /blood-requests/{id}/matches:
    get:
      tags: [ blood-requests ]
      summary: Donors who can give blood for this request (admins)
      description: Compatible blood type, active, available, no donation in the last 56 days, not already linked to the request. Nearest first (straight-line km); donors without a location last.
      operationId: matchDonors
      security: [ { sessionCookie: [] } ]
      parameters:
        - { $ref: '#/components/parameters/idPath' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Matching donors., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Match' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /blood-requests/{id}/invitations:
    post:
      tags: [ blood-requests ]
      summary: Invite a matching donor to an open request (admins)
      operationId: inviteDonor
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/idPath' }, { $ref: '#/components/parameters/csrfHeader' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ donor_id ], properties: { donor_id: { type: integer, minimum: 1 } } } } }
      responses:
        '201': { description: The invitation (a donation with status invited)., content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Donation' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /blood-requests/{id}/dispense:
    post:
      tags: [ blood-requests ]
      summary: Give units from the blood bank to an open request (admins)
      description: The blood type must be compatible, the units at most those still needed and available in stock. The request is fulfilled when it has all its units.
      operationId: dispenseUnits
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/idPath' }, { $ref: '#/components/parameters/csrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ blood_type_id, units ]
              properties:
                blood_type_id: { type: integer, minimum: 1, maximum: 8 }
                units: { type: integer, minimum: 1, maximum: 50 }
                note: { type: string, maxLength: 255 }
      responses:
        '200': { description: The request after receiving the units., content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BloodRequest' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /blood-donations:
    post:
      tags:
        - blood-donations
      summary: Offer to donate, for a request or to the blood bank (donors)
      description: Leave out request_id to offer to the blood bank. Only one pending or accepted independent offer per donor. An offer requires separate admin acceptance before physical completion. A donor-withdrawn request offer can be submitted again using the same request_id; its existing record returns to pending and requires a fresh admin decision. Admin-cancelled or declined offers cannot be reopened this way.
      operationId: offerDonation
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id:
                  type:
                    - integer
                    - 'null'
                  minimum: 1
      responses:
        '201':
          description: The offer (status pending).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Donation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
        - blood-donations
      summary: List donations (donors their own, admins all)
      operationId: listDonations
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - created_at
              - -created_at
            default: -created_at
        - name: status
          in: query
          schema:
            type: string
            enum:
              - invited
              - pending
              - accepted
              - completed
              - declined
              - cancelled
        - name: request_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of donations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Donation'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '403':
          $ref: '#/components/responses/Forbidden'

  /blood-donations/eligibility:
    get:
      tags: [ blood-donations ]
      summary: Can I donate today? (donors)
      operationId: myEligibility
      security: [ { sessionCookie: [] } ]
      responses:
        '200': { description: Eligibility today., content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Eligibility' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /blood-donations/{id}/respond:
    patch:
      tags: [ blood-donations ]
      summary: Accept or decline an invitation (the invited donor)
      operationId: respondToInvitation
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/idPath' }, { $ref: '#/components/parameters/csrfHeader' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ accept ], properties: { accept: { type: boolean } } } } }
      responses:
        '200': { description: 'The donation: pending if accepted, declined otherwise.', content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Donation' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /blood-donations/{id}/withdraw:
    patch:
      tags:
        - blood-donations
      summary: Withdraw my pending or accepted offer (donor)
      operationId: withdrawOffer
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/idPath'
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: The cancelled donation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Donation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /blood-donations/{id}/confirm:
    patch:
      tags:
        - blood-donations
      summary: Confirm physical donation received after screening (admins)
      description: Requires accepted status; a pending offer returns 409 and must first pass through /accept. Only use after blood has physically been collected and screened. Sets completed and the donor donation date, starting the 56-day interval. The unit goes to an open linked request or otherwise to blood-bank stock. Repeated or simultaneous confirmations cannot count the unit twice.
      operationId: confirmDonation
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/idPath'
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: The completed donation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Donation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
