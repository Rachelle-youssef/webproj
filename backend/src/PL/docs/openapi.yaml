          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - created_at
              - -created_at
      operationId: listMedicineBatches
    post:
      tags:
        - Medicines
      summary: Submit a medicine donation for review (donor)
      security:
        - sessionCookie: []
      responses:
        '201':
          description: Donation submitted
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/MedicineBatch"
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Forbidden
        '404':
          description: Record not found
        '409':
          description: State conflict
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Test medicine
                category_id:
                  type: integer
                  minimum: 1
                  example: 1
                quantity_donated:
                  type: integer
                  minimum: 1
                  example: 3
                expiry_date:
                  type: string
                  format: date
                  example: 2030-01-01
                description:
                  type: string
                photo_url:
                  type: string
                  format: uri
                call_id:
                  type: integer
                  minimum: 1
              required:
                - name
                - category_id
                - quantity_donated
                - expiry_date
      operationId: submitMedicineBatch
  /medicines/{id}/review:
    patch:
      tags:
        - Medicines
      summary: Approve or reject a medicine donation (admin)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/MedicineBatch"
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Forbidden
        '404':
          description: Record not found
        '409':
          description: State conflict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                    - approve
                    - reject
                note:
                  type: string
                  description: Required when rejecting
              required:
                - decision
      operationId: reviewMedicineBatch

  /medicines/{id}:
    get:
      tags: [ Medicines ]
      summary: Look up a medicine batch by ID (admin)
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Medicine batch and its current status, content: { application/json: { schema: { type: object, required: [ data ], properties: { data: { $ref: "#/components/schemas/MedicineBatch" } } } } } }
        '401': { description: Sign in required }
        '403': { description: Admin role required }
        '404': { description: Batch not found }
      operationId: getMedicineBatch
  /medicines/{id}/qr:
    get:
      tags: [ Medicines ]
      summary: Download an approved batch's QR label (admin)
      description: Scans as lifelink:medication:<id>:exp:<YYYY-MM-DD>. Use the scanned ID to look up the batch's current status.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: PNG QR label
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { description: Sign in required }
        '403': { description: Admin role required }
        '404': { description: Batch not found }
        '409': { description: Batch is not approved }
      operationId: getMedicineQrLabel

  /medicines/available:
    get:
      tags: [ Medicines ]
      summary: List approved, unexpired batches with stock (patient, hospital, admin)
      security:
        - sessionCookie: []
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: sort, schema: { type: string, enum: [ expiry_date, -expiry_date ] } }
      responses:
        '200': { description: Available batches and pagination, content: { application/json: { schema: { type: object, required: [ data, meta ], properties: { data: { type: array, items: { $ref: "#/components/schemas/AvailableMedicine" } }, meta: { $ref: "#/components/schemas/ListMeta" } } } } } }
        '401': { description: Sign in required }
        '403': { description: Role cannot view medicine availability }
      operationId: listAvailableMedicines
  /medicine-requests:
    get:
      tags: [ Medicines ]
      summary: List own requests as patient or hospital, or all as admin
      security:
        - sessionCookie: []
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: sort, schema: { type: string, enum: [ created_at, -created_at ] } }
        - { in: query, name: status, schema: { type: string, enum: [ pending, approved, rejected, cancelled ] } }
      responses:
        '200': { description: Requests and pagination, content: { application/json: { schema: { type: object, required: [ data, meta ], properties: { data: { type: array, items: { $ref: "#/components/schemas/MedicineRequest" } }, meta: { $ref: "#/components/schemas/ListMeta" } } } } } }
        '401': { description: Sign in required }
        '403': { description: Role cannot view requests }
      operationId: listMedicineRequests
    post:
      tags: [ Medicines ]
      summary: Request units from an available batch (patient or hospital)
      description: Creates a pending request. The request does not reserve or deduct stock.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ medicine_id, quantity ]
              properties:
                medicine_id: { type: integer, minimum: 1, example: 1 }
                quantity: { type: integer, minimum: 1, maximum: 10000, example: 2 }
      responses:
        '201': { description: Pending request, content: { application/json: { schema: { type: object, required: [ data ], properties: { data: { $ref: "#/components/schemas/MedicineRequest" } } } } } }
        '400': { description: Invalid input }
        '401': { description: Sign in required }
        '403': { description: Patient or hospital role required }
        '404': { description: Batch not found }
        '409': { description: Batch or requested quantity unavailable }
      operationId: submitMedicineRequest

  /medicine-requests/{id}/dispense:
    patch:
      tags: [ Medicines ]
      summary: Record physical handoff of medicine and deduct stock (admin)
      description: A successful handoff sets the request status to approved and returns the remaining batch quantity. A batch with no units remaining becomes dispensed.
      security:
        - sessionCookie: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200': { description: Approved request with remaining batch quantity, content: { application/json: { schema: { type: object, required: [ data ], properties: { data: { $ref: "#/components/schemas/MedicineRequest" } } } } } }
        '400': { description: Invalid ID }
        '401': { description: Sign in required }
        '403': { description: Admin role required }
        '404': { description: Request not found }
        '409': { description: Request already processed or batch stock unavailable or expired }
      operationId: dispenseMedicineRequest

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ll_session
      description: httpOnly session cookie set by POST /auth/login.

  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    csrfHeader:
      name: X-Requested-With
      in: header
      required: true
      description: Must be exactly LifeLink on every request that changes data.
      schema: { type: string, const: LifeLink }

  schemas:
    MedicineCallInput:
      type: object
      properties:
        medicine_name:
          type: string
          minLength: 2
          maxLength: 120
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
        note:
          type:
            - string
            - 'null'
          maxLength: 300
      required:
        - medicine_name
        - quantity
    MedicineCall:
      type: object
      properties:
        id: &a1
          type: integer
          minimum: 0
        medicine_name: &a3
          type: string
        quantity: *a1
        note: &a4
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - open
            - closed
        closed_at: &a2
          type:
            - string
            - 'null'
          format: date-time
        created_at: *a2
    MedicineCallResult:
      type: object
      properties:
        call:
          $ref: '#/components/schemas/MedicineCall'
        notified: *a1
    BloodCallResult:
      type: object
      properties:
        id: *a1
        status:
          type: string
          const: open
        notified: *a1
    Notification:
      type: object
      properties:
        id: *a1
        type:
          type: string
          enum:
            - sos
            - request
            - invite
            - response
            - donation
            - medicine
            - thanks
            - account
        message: *a3
        link: *a4
        is_read:
          type: boolean
        created_at: *a2
    FeedItem:
      type: object
      properties:
        id: *a1
        kind:
          type: string
          enum:
            - blood
            - medicine
        title: *a3
        quantity: *a1
        at: *a2
        city: *a4
    MapRequest:
      type: object
      properties:
        id: *a1
        hospital_name: *a3
        city: *a4
        latitude:
          type: number
        longitude:
          type: number
        urgency:
          type: string
          enum:
            - normal
            - urgent
            - sos
        units_needed: *a1
        units_received: *a1
        blood_type: *a3
    AuditLog:
      type: object
      properties:
        id: *a1
        user_id:
          type:
            - integer
            - 'null'
        action: *a3
        entity: *a4
        entity_id:
          type:
            - integer
            - 'null'
        ip_address: *a4
        created_at: *a2
    PublicStats:
      type: object
      properties:
        blood_donations: *a1
        medicines: *a1
        donors: *a1
        fulfilled: *a1
        stock: &a5
          type: array
          items:
            type: object
            properties:
              blood_type: *a3
              units_available: *a1
    AdminStats:
      type: object
      properties:
        open_requests: &a1
          type: integer
          minimum: 0
        pending_requests: *a1
        pending_donations: *a1
        completed_donations: *a1
        pending_medicines: *a1
        pending_medicine_requests: *a1
        open_medicine_calls: *a1
        donors: *a1
        stock:
          type: array
          items:
            type: object
            properties:
              blood_type: &a2
                type: string
              units_available: *a1
        daily:
          type: array
          description: UTC dates for the last 14 days; dates with no events are omitted.
          items:
            type: object
            properties:
              d:
                type: string
                format: date
              n: *a1
        urgency:
          type: array
          items:
            type: object
            properties:
              urgency: *a2
              n: *a1
        accepted_donations:
          type: integer
          minimum: 0
          description: Offers accepted and awaiting physical collection/completion.
    Error:
      type: object
      required: [ error ]
      properties:
        error:
          type: object
          required: [ code, message ]
          properties:
            code:
              type: string
              examples: [ VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED ]
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    ListMeta:
      type: object
      required: [ page, limit, total, pages ]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        pages: { type: integer, minimum: 1 }
    User:
      type: object
      properties:
        id: { type: integer }
        full_name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ donor, recipient, hospital, admin ] }
        phone: { type: [ string, 'null' ] }
        city: { type: [ string, 'null' ] }
        latitude: { type: [ number, 'null' ] }
        longitude: { type: [ number, 'null' ] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        donor:
          description: Only for donors; null for every other role.
          oneOf:
            - type: 'null'
            - type: object
              properties:
                blood_type_id: { type: integer, minimum: 1, maximum: 8 }
                blood_type: { type: string, examples: [ O- ] }
                last_donation_date: { type: [ string, 'null' ], format: date }
                is_available: { type: boolean }
    RegisterInput:
      type: object
      description: Hospital accounts require both coordinates, inside Lebanon. Coordinates are optional for other roles.
      required: [ full_name, email, password, role, city ]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        role: { type: string, enum: [ donor, recipient, hospital ] }
        city: { type: string, minLength: 2, maxLength: 60 }
        phone: { type: string, description: 'For example +961 3 123 456' }
        latitude: { type: number, minimum: -90, maximum: 90, description: Send together with longitude. }
        longitude: { type: number, minimum: -180, maximum: 180, description: Send together with latitude. }
        blood_type_id: { type: integer, minimum: 1, maximum: 8, description: 'Required for donors. 1 A+, 2 A-, 3 B+, 4 B-, 5 AB+, 6 AB-, 7 O+, 8 O-' }
    LoginInput:
      type: object
      required: [ email, password ]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 128 }
    ProfileUpdate:
      type: object
      description: Hospital coordinates must remain a complete pin inside Lebanon and cannot be cleared. Changing a saved profile pin does not move earlier blood requests.
      properties:
        full_name: { type: string, minLength: 2, maxLength: 100 }
        phone:
          type: [ string, 'null' ]
          description: A phone number such as +961 3 123 456. Send null or blank text to remove it; omit to keep it unchanged.
        city: { type: string, minLength: 2, maxLength: 60 }
        latitude: { type: [ number, 'null' ], minimum: -90, maximum: 90 }
        longitude: { type: [ number, 'null' ], minimum: -180, maximum: 180 }
        is_available: { type: boolean, description: Donors only. }
    PasswordChange:
      type: object
      required: [ current_password, new_password ]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 128 }
    BloodType:
      type: object
      properties: { id: { type: integer }, label: { type: string, examples: [ O- ] } }
    BloodRequestInput:
      type: object
      description: Use treating-hospital coordinates. Hospitals may omit them to reuse their saved pin; recipient profile coordinates are never used as a fallback.
      required: [ blood_type_id, units_needed, hospital_name ]
      properties:
        blood_type_id: { type: integer, minimum: 1, maximum: 8 }
        units_needed: { type: integer, minimum: 1, maximum: 50 }
        urgency: { type: string, enum: [ normal, urgent, sos ], default: normal }
        hospital_name: { type: string, minLength: 2, maxLength: 120 }
        city: { type: string, minLength: 2, maxLength: 60 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    BloodRequest:
      type: object
      description: Full view, for the requester and admins.
      properties:
        id: { type: integer }
        blood_type_id: { type: integer }
        blood_type: { type: string }
        units_needed: { type: integer }
        units_received: { type: integer }
        urgency: { type: string, enum: [ normal, urgent, sos ] }
        hospital_name: { type: string }
        city: { type: [ string, 'null' ] }
        latitude: { type: [ number, 'null' ] }
        longitude: { type: [ number, 'null' ] }
        has_hospital_pin: { type: boolean, description: Coordinates explicitly identify the treating hospital. }
        status: { type: string, enum: [ pending, open, fulfilled, cancelled ] }
        admin_note: { type: [ string, 'null' ] }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: [ string, 'null' ], format: date-time }
        requester: { type: object, properties: { id: { type: integer }, full_name: { type: string } } }
    OpenBloodRequest:
      type: object
      description: What donors see. No requester identity or admin note; my_response is the donor's own answer, if any.
      properties:
        id: { type: integer }
        blood_type_id: { type: integer }
        blood_type: { type: string }
        units_needed: { type: integer }
        units_received: { type: integer }
        urgency: { type: string, enum: [ normal, urgent, sos ] }
        hospital_name: { type: string }
        city: { type: [ string, 'null' ] }
        latitude: { type: [ number, 'null' ] }
        longitude: { type: [ number, 'null' ] }
        has_hospital_pin: { type: boolean, description: Coordinates explicitly identify the treating hospital. }
        created_at: { type: string, format: date-time }
        can_offer_again: { type: boolean, description: 'A withdrawn offer may be submitted again for a fresh admin decision.' }
        my_response: { type: [ string, 'null' ], enum: [ invited, pending, accepted, completed, declined, cancelled, null ] }
    Donation:
      type: object
      properties:
        can_offer_again: { type: boolean, description: Only a donor-withdrawn offer can be submitted again for fresh admin review. }
        id:
          type: integer
        status:
          type: string
          enum:
            - invited
            - pending
            - accepted
            - completed
            - declined
            - cancelled
        admin_note:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        reviewed_at:
          type:
            - string
            - 'null'
          format: date-time
        donor:
          type: object
          properties:
            id:
              type: integer
            full_name:
              type: string
            blood_type:
              type: string
        request:
          description: null for a donation to the blood bank.
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id:
                  type: integer
                hospital_name:
                  type: string
                city:
                  type:
                    - string
                    - 'null'
                blood_type:
                  type: string
                urgency:
                  type: string
                status:
                  type: string
        accepted_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the admin accepted the offer; NULL for earlier records with no acceptance history.
    Match:
      type: object
      properties:
        donor_id: { type: integer }
        full_name: { type: string }
        blood_type: { type: string }
        city: { type: [ string, 'null' ] }
        distance_km: { type: [ number, 'null' ], description: 'Straight-line distance to the request; null when either side has no location.' }
        last_donation_date: { type: [ string, 'null' ], format: date }
    Eligibility:
      type: object
      properties:
        eligible: { type: boolean }
        last_donation_date: { type: [ string, 'null' ], format: date }
        next_eligible_date: { type: string, format: date }
        days_remaining: { type: integer, minimum: 0 }
        interval_days: { type: integer, examples: [ 56 ] }
    StockLevel:
      type: object
      properties:
        blood_type_id: { type: integer }
        blood_type: { type: string }
        units_available: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    StockMovement:
      type: object
      properties:
        id: { type: integer }
        blood_type: { type: string }
        change_units: { type: integer, description: 'Positive when units came in, negative when they went out.' }
        reason: { type: string, enum: [ donation, dispensed, adjustment ] }
        donation_id: { type: [ integer, 'null' ] }
        request_id: { type: [ integer, 'null' ] }
        created_by: { type: [ string, 'null' ] }
        note: { type: [ string, 'null' ] }
        created_at: { type: string, format: date-time }
    Health:
      type: object
      required: [ status, database, version, uptime_seconds, time ]
      properties:
        status: { type: string, enum: [ ok, degraded ] }
        database: { type: string, enum: [ up, down ] }
        version: { type: string }
        uptime_seconds: { type: integer }
        time: { type: string, format: date-time }
    MedicineCategory:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 255
        name:
          type: string
    MedicineBatch:
      type: object
      description: A full donation batch visible to its donor or an admin. Stock starts at zero until approval.
      required:
        - id
        - donor_id
        - category_id
        - name
        - quantity_donated
        - quantity_available
        - expiry_date
        - status
      properties:
        id: &a6
          type: integer
          minimum: 1
          maximum: 4294967295
        donor_id: *a6
        category_id:
          type: integer
          minimum: 1
          maximum: 255
        call_id: &a8
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 4294967295
        name:
          type: string
          maxLength: 120
        description: &a7
          type:
            - string
            - "null"
        quantity_donated:
          type: integer
          minimum: 1
          maximum: 10000
        quantity_available:
          type: integer
          minimum: 0
          maximum: 10000
        expiry_date:
          type: string
          format: date
        photo_url:
          type:
            - string
            - "null"
          format: uri
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - expired
            - dispensed
        admin_note: *a7
        reviewed_by: *a8
        reviewed_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AvailableMedicine:
      type: object
      description: Approved, unexpired stock. This public-to-authorized-roles view excludes donor identity and admin notes.
      required:
        - id
        - category_id
        - name
        - quantity_available
        - expiry_date
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 4294967295
        category_id:
          type: integer
          minimum: 1
          maximum: 255
        name:
          type: string
        description:
          type:
            - string
            - "null"
        quantity_available:
          type: integer
          minimum: 1
          maximum: 10000
        expiry_date:
          type: string
          format: date
        photo_url:
          type:
            - string
            - "null"
          format: uri
    MedicineRequest:
      type: object
      required:
        - id
        - requester_id
        - medicine_id
        - quantity
        - status
      properties:
        id: &a6
          type: integer
          minimum: 1
          maximum: 4294967295
        requester_id: *a6
        medicine_id: *a6
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - cancelled
          description: Approved means the admin recorded the physical medicine handoff.
        admin_note:
          type:
            - string
            - "null"
        reviewed_by:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 4294967295
        reviewed_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        medicine_name:
          type: string
          description: Included when listing requests.
        quantity_available:
          type: integer
          minimum: 0
          maximum: 10000
          description: Remaining batch stock; included in the dispense response.

  responses:
    ValidationError:
      description: A field is missing or not valid (code VALIDATION_ERROR, BAD_JSON).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: VALIDATION_ERROR, message: Some fields are not valid., details: [ { field: email, message: Invalid value } ] } }
    Unauthenticated:
      description: Not signed in, or the session expired (code UNAUTHENTICATED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Signed in, but this role may not do this (code FORBIDDEN), or the CSRF header is missing (code CSRF_HEADER_MISSING).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The record does not exist (code NOT_FOUND).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The action clashes with the current state, for example a duplicate (code CONFLICT).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests from this address (code RATE_LIMITED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
